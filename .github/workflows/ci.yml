name: Verify services
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash -n start-map.sh
      - run: docker compose config --quiet
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from integration
        timeout-minutes: 10
      - if: always()
        run: docker compose -f compose.test.yml logs
      - if: always()
        run: docker compose -f compose.test.yml down -v
  map-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 make_demo_data.py
      - run: docker compose -f compose.map-test.yml run --build --rm integration
        timeout-minutes: 10
      - if: always()
        run: docker compose -f compose.map-test.yml logs
      - if: always()
        run: docker compose -f compose.map-test.yml down -v
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r web_map/requirements.txt pip-audit==2.10.1
      - run: pip check
      - run: pip-audit --progress-spinner off
